name: Publishing

on:
  workflow_run:
    workflows: ["PR Checks", "Security Scans"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      checks-run: ${{ steps.check.outputs.checks_run }}
    steps:
      - name: Require successful tests and security for the same main commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" != "$SOURCE_SHA" ]; then
            echo 'A newer main commit superseded this delivery run.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&head_sha=$SOURCE_SHA&per_page=100" > runs.json
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const runs = JSON.parse(readFileSync('runs.json')).workflow_runs;
          const successful = name => {
            const latest = runs.filter(run => run.name === name && run.head_sha === process.env.SOURCE_SHA).sort((a,b) => b.id-a.id)[0];
            return latest?.status === 'completed' && latest.conclusion === 'success' ? latest : undefined;
          };
          const checks = successful('PR Checks');
          const security = successful('Security Scans');
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=${Boolean(checks && security)}\nchecks_run=${checks?.id ?? ''}\n`);
          JS

  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v5
        with:
          name: delivery-paths
          run-id: ${{ needs.gate.outputs.checks-run }}
          github-token: ${{ github.token }}
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Plan changed package versions
        run: node scripts/plan-release.mjs
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy production backend once when SDK changes
        if: env.RELEASE_SDK == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo 'Configure CONVEX_PRODUCTION_DEPLOY_KEY (a production deployment, separate from CI).'; exit 1; }
          npx convex deploy --yes
      - name: Build and check public package contracts
        run: |
          npm run build
          npm run test:contracts
          npm run build --workspace=@cortexmemory/vercel-ai-provider
          node packages/cortex-cli/scripts/sync-quickstart-template.js
          npm run build --workspace=@cortexmemory/cli
      - name: Publish SDK, provider, then CLI using npm trusted publishing
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
