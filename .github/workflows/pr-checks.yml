name: PR Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_ci:
        description: Qualify every managed, native, demo and paid suite
        type: boolean
        default: false
      queue_probe:
        description: Hold lifecycle lock for 25 seconds; no functional/service/delivery proof
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - dev
      - chore/cortex-0.37-modernization
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Only the called managed lifecycle holds the shared backend lock.
# Offline and isolated native/graph/demo jobs can proceed while it is queued.
# Default permissions: read-only
# Write permissions are granted explicitly at job level
permissions:
  contents: read

# Backend integration jobs require trusted same-repository changes and dedicated CI deployments.
# Draft, fork and bot PRs run secret-free offline checks; service gaps are explicit.

jobs:
  demo-contracts:
    name: Build demo (${{ matrix.folder }})
    needs: [detect-changes, candidate-artifacts]
    if: needs.detect-changes.outputs.demo-contracts == 'true'
    runs-on: ubuntu-latest
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
        env:
          CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
          CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
          DISABLE_BEACON: "true"
        ports: [3210:3210, 3211:3211]
        options: --health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.detect-changes.outputs.demos || '[]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify exact candidate bytes and restore built CLI composer
        env:
          CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-candidate-artifacts.mjs verify "$RUNNER_TEMP/candidate" "$CI_CANDIDATE_SHA"
      - name: Use the demo package manager
        run: |
          PIN=$(node -p 'require("./${{ matrix.folder }}/package.json").packageManager')
          if [[ "$PIN" == pnpm@* ]]; then npm install --global "$PIN"; fi
      - name: Install and compose demo against the packed packages
        run: |
          args=(--directory "${{ matrix.folder }}" --sdk-archive "$SDK_ARCHIVE" --cli-source "$GITHUB_WORKSPACE/packages/cortex-cli")
          if node -e 'process.exit(require("./${{ matrix.folder }}/package.json").dependencies["@cortexmemory/vercel-ai-provider"] ? 0 : 1)'; then
            args+=(--provider-archive "$PROVIDER_ARCHIVE")
          fi
          node scripts/install-ci-demo.mjs "${args[@]}"
      - name: Generate genuine demo backend bindings
        working-directory: ${{ matrix.folder }}
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210 CONVEX_SELF_HOSTED_ADMIN_KEY="$CI_ADMIN_KEY" node node_modules/convex/bin/main.js dev --once --typecheck enable --tail-logs disable
      - name: Build demo
        working-directory: ${{ matrix.folder }}
        run: npm run build
      - name: Run basic demo unit tests
        if: matrix.folder == 'packages/cortex-cli/templates/basic'
        working-directory: ${{ matrix.folder }}
        run: npm run test:unit

  template-catalog:
    name: Independent template catalog
    needs: detect-changes
    if: needs.detect-changes.outputs.template-catalog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup

      - run: npm ci
      - run: npm run lint --workspace=@cortexmemory/templates
      - run: npm run typecheck --workspace=@cortexmemory/templates
      - run: npm test --workspace=@cortexmemory/templates

  graph-contracts:
    name: Neo4j and Memgraph contracts
    needs: detect-changes
    if: needs.detect-changes.outputs.graph-contracts == 'true'
    runs-on: ubuntu-latest
    env:
      CONVEX_TEST_MODE: local
      CONVEX_URL: 'http://127.0.0.1:3210'
      LOCAL_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_TEST_EXPECTED_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_CI_EXPECTED_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_CI_PREPARE_NATIVE_FIXTURES: 'true'
      CORTEX_CI_ALLOW_DESTRUCTIVE_RESET: 'true'
      CORTEX_CI_TARGET_CLASS: isolated-native
      CORTEX_CI_NATIVE_OWNER: '${{ github.run_id }}-${{ github.run_attempt }}-native-ci'
    services:
      convex:
        image: 'ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4'
        env:
          CONVEX_CLOUD_ORIGIN: 'http://127.0.0.1:3210'
          CONVEX_SITE_ORIGIN: 'http://127.0.0.1:3211'
          DISABLE_BEACON: 'true'
        ports:
          - '3210:3210'
          - '3211:3211'
        options: '--health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30'
      neo4j:
        image: 'neo4j:5-community'
        env:
          NEO4J_AUTH: neo4j/cortex-test-password
        ports:
          - '7687:7687'
      memgraph:
        image: 'memgraph/memgraph:latest'
        ports:
          - '7688:7687'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - name: Prepare isolated authenticated native graph backend
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          echo "CONVEX_DEPLOY_KEY=$CI_ADMIN_KEY" >> "$GITHUB_ENV"
          echo "CORTEX_CI_NATIVE_CONTAINER_ID=${{ job.services.convex.id }}" >> "$GITHUB_ENV"
          CORTEX_CI_NATIVE_CONTAINER_ID="${{ job.services.convex.id }}" CONVEX_DEPLOY_KEY="$CI_ADMIN_KEY" node scripts/prepare-ci-backend.mjs
      - name: Build provider and SDK graph runtime
        run: |
          npm run build
          npm run build --workspace=@cortexmemory/vercel-ai-provider
      - name: Wait for graph services and run contracts
        env:
          GRAPH_TESTING_ENABLED: 'true'
          CONVEX_TEST_MODE: local
          CONVEX_URL: 'http://127.0.0.1:3210'
          NEO4J_URI: 'bolt://127.0.0.1:7687'
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: cortex-test-password
          MEMGRAPH_URI: 'bolt://127.0.0.1:7688'
          MEMGRAPH_USERNAME: ''
          MEMGRAPH_PASSWORD: ''
        run: |
          node --input-type=module <<'JS'
          import neo4j from 'neo4j-driver';
          for (const [url,auth] of [[process.env.NEO4J_URI,neo4j.auth.basic('neo4j',process.env.NEO4J_PASSWORD)],[process.env.MEMGRAPH_URI,undefined]]) {
            const driver = neo4j.driver(url,auth);
            try {
              let ready = false;
              for (let attempt=0;attempt<30;attempt++) {
                try { await driver.verifyConnectivity(); ready=true; break; }
                catch { await new Promise(resolve=>setTimeout(resolve,2000)); }
              }
              if (!ready) throw Error(`Graph service unavailable: ${url}`);
            } finally { await driver.close(); }
          }
          JS
          timeout --signal=TERM --kill-after=5s 240s node --experimental-vm-modules node_modules/jest/bin/jest.js --runTestsByPath tests/graph/graphAdapter.test.ts tests/graph/managed-runtime-safety.test.ts --runInBand --forceExit=false
          npx tsx scripts/cleanup-test-data.ts native
          cd packages/vercel-ai-provider
          timeout --signal=TERM --kill-after=5s 240s node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --selectProjects graph --runInBand --forceExit=false
      - name: Retire isolated native graph fixtures after every consumer outcome
        if: always()
        run: npx tsx scripts/cleanup-test-data.ts native

  public-contracts:
    name: Packed package and browser contracts
    if: inputs.queue_probe != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - run: npm run build
      - run: 'npm run test:contracts'
      - run: npm run build --workspace=@cortexmemory/cli
      - name: 'Exercise disposable-target, scoped JWT, lifecycle, installation and environment guards offline'
        run: node --test scripts/ci/*.test.mjs
      - name: 'CI, security and delivery readiness regressions'
        run: node --test tests/ci-pipeline.test.mjs tests/ci-managed.test.mjs tests/ci-candidate-artifacts.test.mjs tests/security-pipeline.test.mjs tests/release-pipeline.test.mjs
      - name: Verify candidate-install refusals and transitive closure
        run: |
          npm install --global pnpm@10.33.0
          node --test scripts/install-ci-demo.test.mjs

  native-proof-contracts:
    name: 'Serialized native export, erasure and scope proofs'
    needs: detect-changes
    if: needs.detect-changes.outputs.native-proof-contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      convex:
        image: 'ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4'
        env:
          CONVEX_CLOUD_ORIGIN: 'http://127.0.0.1:3210'
          CONVEX_SITE_ORIGIN: 'http://127.0.0.1:3211'
          DISABLE_BEACON: 'true'
        ports:
          - '3210:3210'
          - '3211:3211'
        options: '--health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30'
    env:
      CONVEX_TEST_MODE: local
      CONVEX_URL: 'http://127.0.0.1:3210'
      LOCAL_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_TEST_EXPECTED_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_CI_EXPECTED_CONVEX_URL: 'http://127.0.0.1:3210'
      CORTEX_CI_PREPARE_NATIVE_FIXTURES: 'true'
      CORTEX_CI_ALLOW_DESTRUCTIVE_RESET: 'true'
      CORTEX_CI_TARGET_CLASS: isolated-native
      CORTEX_CI_NATIVE_OWNER: '${{ github.run_id }}-${{ github.run_attempt }}-native-ci'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - name: Authenticate the disposable native backend
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          echo "CONVEX_DEPLOY_KEY=$CI_ADMIN_KEY" >> "$GITHUB_ENV"
          echo "CORTEX_CI_NATIVE_CONTAINER_ID=${{ job.services.convex.id }}" >> "$GITHUB_ENV"
      - name: Prepare genuine canonical backend with private test fixtures
        run: node scripts/prepare-ci-backend.mjs
      - name: Run native proofs without unrelated concurrent seeds
        run: |
          for file in tests/user-export.test.ts tests/fact-history-provenance.test.ts \
            tests/facts-revision-scope.test.ts tests/domain-scope.test.ts tests/domain-operations.test.ts tests/memorySpaces.test.ts tests/operation-sequences.test.ts tests/gdprCascade.test.ts; do
            npx tsx scripts/cleanup-test-data.ts native
            timeout --signal=TERM --kill-after=5s 240s node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --runTestsByPath "$file" --forceExit=false
          done
      - name: Retire isolated native proof fixtures after every outcome
        if: always()
        run: npx tsx scripts/cleanup-test-data.ts native


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 1: Detect which files changed (fast, runs first)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  detect-changes:
    name: Detect File Changes
    if: inputs.queue_probe != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      candidate-artifacts: ${{ steps.select.outputs.candidate-artifacts }}
      offline-packages: ${{ steps.select.outputs.offline-packages }}
      template-catalog: ${{ steps.select.outputs.template-catalog }}
      demo-contracts: ${{ steps.select.outputs.demo-contracts }}
      graph-contracts: ${{ steps.select.outputs.graph-contracts }}
      native-proof-contracts: ${{ steps.select.outputs.native-proof-contracts }}
      managed: ${{ steps.select.outputs.managed }}
      managed-sdk: ${{ steps.select.outputs.managed-sdk }}
      managed-provider: ${{ steps.select.outputs.managed-provider }}
      managed-cli: ${{ steps.select.outputs.managed-cli }}
      cli: ${{ steps.select.outputs.cli }}
      provider: ${{ steps.select.outputs.provider }}
      demos: ${{ steps.select.outputs.demos }}
      sdk-release: ${{ steps.select.outputs.sdk-release }}
      provider-release: ${{ steps.select.outputs.provider-release }}
      cli-release: ${{ steps.select.outputs.cli-release }}
      templates-release: ${{ steps.select.outputs.templates-release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
        with:
          cache: 'false'
      - name: Select dependency and trust coverage
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-contract.mjs select
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: delivery-paths
          path: delivery-paths.json
          if-no-files-found: error
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 2: Deploy Convex & Purge Database (runs once before all tests)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  code-quality:
    name: 'Code Quality (Lint, Types & Offline Unit)'
    if: inputs.queue_probe != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - name: Pure SDK unit contracts without live environment loading
        run: |
          npm run build:backend
          timeout --signal=TERM --kill-after=5s 240s node scripts/ci-contract.mjs offline-unit

  offline-packages:
    name: Offline CLI and provider contracts
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.offline-packages == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - run: npm run build
      - name: CLI lint and types
        if: needs.detect-changes.outputs.cli == 'true'
        run: |
          npm run lint --workspace=@cortexmemory/cli
          npm run typecheck --workspace=@cortexmemory/cli
      - name: Build the CLI executable before command contracts
        run: npm run build --workspace=@cortexmemory/cli
        if: needs.detect-changes.outputs.cli == 'true'
      - name: Install supported completion shells for command contracts
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh fish
        if: needs.detect-changes.outputs.cli == 'true'
      - name: Prepare isolated command fixtures from current built dependencies
        run: node scripts/ci/command-fixtures.mjs prepare --directory "$RUNNER_TEMP/cortex-cli-command-fixtures" --env-file "$GITHUB_ENV"
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ''
        if: needs.detect-changes.outputs.cli == 'true'
      - name: Run CLI unit and command contracts without live credentials
        run: 'npm run test:fast --workspace=@cortexmemory/cli -- --runInBand'
        env:
          CONVEX_URL: 'https://unit.invalid'
          CONVEX_URL_CLI: 'https://unit.invalid'
          CORTEX_CI_AUTH_PRIVATE_KEY: ''
        if: needs.detect-changes.outputs.cli == 'true'
      - name: Remove owned offline command fixtures after success or failure
        if: always() && needs.detect-changes.outputs.cli == 'true'
        run: node scripts/ci/command-fixtures.mjs cleanup --directory "$RUNNER_TEMP/cortex-cli-command-fixtures"
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ''
      - name: 'Provider types, exports and mocked unit/integration'
        if: needs.detect-changes.outputs.provider == 'true'
        run: |
          npm run lint --workspace=@cortexmemory/vercel-ai-provider
          npm run build --workspace=@cortexmemory/vercel-ai-provider
          npm run test:unit --workspace=@cortexmemory/vercel-ai-provider -- --runInBand --forceExit=false
          npm run test:integration --workspace=@cortexmemory/vercel-ai-provider -- --runInBand --forceExit=false
        env:
          CONVEX_URL: 'https://unit.invalid'
          CONVEX_URL_CLI: 'https://unit.invalid'
          CORTEX_TEST_ENV_MODE: explicit
          CORTEX_CI_AUTH_PRIVATE_KEY: ''
          CORTEX_TEST_AUTH_TOKEN: ''
          CORTEX_TEST_READER_TOKEN: ''
          CORTEX_TEST_OUTSIDER_TOKEN: ''
          CORTEX_TEST_FIXTURE: ''


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 3: TypeScript SDK Tests (five shards sharing one deployment)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  managed-tests:
    name: Complete managed lifecycle
    needs: detect-changes
    if: needs.detect-changes.outputs.managed == 'true'
    uses: ./.github/workflows/managed-ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      candidate-sha: '${{ github.event.pull_request.head.sha || github.sha }}'
      selection: '${{ needs.detect-changes.outputs.selection }}'
    secrets:
      CORTEX_CI_AUTH_PRIVATE_KEY: '${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}'
      CORTEX_CI_CONVEX_URL: '${{ secrets.CORTEX_CI_CONVEX_URL }}'
      CORTEX_CI_CONVEX_URL_CLI: '${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}'
      CORTEX_CI_CONVEX_DEPLOY_KEY: '${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY }}'
      CORTEX_CI_CONVEX_DEPLOY_KEY_CLI: '${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY_CLI }}'

  managed-queue-probe:
    name: Queue-only managed caller
    if: github.event_name == 'workflow_dispatch' && inputs.queue_probe == true
    uses: ./.github/workflows/managed-ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      candidate-sha: ${{ github.sha }}
      queue_probe: true

  queue-probe-offline:
    name: Independent offline queue observation
    if: github.event_name == 'workflow_dispatch' && inputs.queue_probe == true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          date -u '+offline-start %Y-%m-%dT%H:%M:%SZ'
          echo 'Queue-only observation; no functional/service/delivery proof.' >> "$GITHUB_STEP_SUMMARY"

  candidate-artifacts:
    name: Build exact candidate demo packages once
    needs: detect-changes
    if: needs.detect-changes.outputs.candidate-artifacts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
      - run: npm ci
      - name: Build SDK, provider and CLI composer once for all selected demos
        run: |
          npm run build
          npm run build --workspace=@cortexmemory/vercel-ai-provider
          npm run build --workspace=@cortexmemory/cli
      - name: Package immutable candidate manifest and archives
        env:
          CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-candidate-artifacts.mjs create "$RUNNER_TEMP/candidate" "$CI_CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 7

  all-checks-passed:
    name: All Checks Passed
    needs:
      [
        public-contracts,
        template-catalog,
        demo-contracts,
        graph-contracts,
        native-proof-contracts,
        detect-changes,
        managed-tests,
        candidate-artifacts,
        code-quality,
        offline-packages,
      ]
    if: always() && inputs.queue_probe != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/_goals/
            !/work/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cortex-setup
        with:
          cache: 'false'
      - name: Require every selected job and report actual coverage
        env:
          CI_SELECTION: ${{ needs.detect-changes.outputs.selection }}
          CI_PARENT: 'true'
          CI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-contract.mjs aggregate
