name: PR Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
      - chore/cortex-0.37-modernization
    types: [opened, synchronize, reopened]

# The SDK/CLI CI deployments are shared: serialize complete runs so one PR
# cannot redeploy a backend while another PR is still testing it.
# Suites within a run use scoped fixtures and execute in parallel.
concurrency:
  group: cortex-shared-ci-backends
  cancel-in-progress: false

# Default permissions: read-only
# Write permissions are granted explicitly at job level
permissions:
  contents: read

# Backend integration jobs require trusted same-repository changes and dedicated CI deployments.
# Fork PRs still run packed-package and isolated graph contracts.

jobs:
  demo-contracts:
    name: Build demo (${{ matrix.folder }})
    runs-on: ubuntu-latest
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
        env:
          CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
          CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
          DISABLE_BEACON: "true"
        ports: [3210:3210, 3211:3211]
        options: --health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        folder:
          - packages/cortex-cli/templates/basic
          - packages/cortex-cli/templates/chat-sdk-quickstart
          - packages/vercel-ai-provider/quickstart
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - run: |
          npm install --global npm@12.2.0
          npm ci
      - name: Pack the SDK and provider under review
        run: |
          npm run build
          npm run build --workspace=@cortexmemory/vercel-ai-provider
          SDK_ARCHIVE=$(npm pack --workspaces=false --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          PROVIDER_ARCHIVE=$(npm pack --workspace=@cortexmemory/vercel-ai-provider --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          echo "SDK_ARCHIVE=$RUNNER_TEMP/$SDK_ARCHIVE" >> "$GITHUB_ENV"
          echo "PROVIDER_ARCHIVE=$RUNNER_TEMP/$PROVIDER_ARCHIVE" >> "$GITHUB_ENV"
      - name: Build the CLI backend composer
        run: npm run build --workspace=@cortexmemory/cli
      - name: Use the demo package manager
        run: |
          PIN=$(node -p 'require("./${{ matrix.folder }}/package.json").packageManager')
          if [[ "$PIN" == pnpm@* ]]; then npm install --global "$PIN"; fi
      - name: Install and compose demo against the packed packages
        run: |
          args=(--directory "${{ matrix.folder }}" --sdk-archive "$SDK_ARCHIVE" --cli-source "$GITHUB_WORKSPACE/packages/cortex-cli")
          if node -e 'process.exit(require("./${{ matrix.folder }}/package.json").dependencies["@cortexmemory/vercel-ai-provider"] ? 0 : 1)'; then
            args+=(--provider-archive "$PROVIDER_ARCHIVE")
          fi
          node scripts/install-ci-demo.mjs "${args[@]}"
      - name: Generate genuine demo backend bindings
        working-directory: ${{ matrix.folder }}
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210 CONVEX_SELF_HOSTED_ADMIN_KEY="$CI_ADMIN_KEY" node node_modules/convex/bin/main.js dev --once --typecheck enable --tail-logs disable
      - name: Build demo
        working-directory: ${{ matrix.folder }}
        run: npm run build
      - name: Run basic demo unit tests
        if: matrix.folder == 'packages/cortex-cli/templates/basic'
        working-directory: ${{ matrix.folder }}
        run: npm run test:unit

  template-catalog:
    name: Independent template catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - run: npm ci
      - run: npm run lint --workspace=@cortexmemory/templates
      - run: npm run typecheck --workspace=@cortexmemory/templates
      - run: npm test --workspace=@cortexmemory/templates

  graph-contracts:
    name: Neo4j and Memgraph contracts
    runs-on: ubuntu-latest
    env:
      CONVEX_TEST_MODE: local
      CONVEX_URL: http://127.0.0.1:3210
      LOCAL_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_TEST_EXPECTED_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_CI_EXPECTED_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_CI_PREPARE_NATIVE_FIXTURES: "true"
      CORTEX_CI_ALLOW_DESTRUCTIVE_RESET: "true"
      CORTEX_CI_TARGET_CLASS: isolated-native
      CORTEX_CI_NATIVE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-native-ci
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
        env:
          CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
          CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
          DISABLE_BEACON: "true"
        ports: [3210:3210, 3211:3211]
        options: --health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/cortex-test-password
        ports: [7687:7687]
      memgraph:
        image: memgraph/memgraph:latest
        ports: [7688:7687]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - run: npm ci
      - name: Prepare isolated authenticated native graph backend
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          echo "CONVEX_DEPLOY_KEY=$CI_ADMIN_KEY" >> "$GITHUB_ENV"
          echo "CORTEX_CI_NATIVE_CONTAINER_ID=${{ job.services.convex.id }}" >> "$GITHUB_ENV"
          CORTEX_CI_NATIVE_CONTAINER_ID="${{ job.services.convex.id }}" CONVEX_DEPLOY_KEY="$CI_ADMIN_KEY" node scripts/prepare-ci-backend.mjs
      - name: Build provider and SDK graph runtime
        run: |
          npm run build
          npm run build --workspace=@cortexmemory/vercel-ai-provider
      - name: Wait for graph services and run contracts
        env:
          GRAPH_TESTING_ENABLED: "true"
          CONVEX_TEST_MODE: local
          CONVEX_URL: http://127.0.0.1:3210
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: cortex-test-password
          MEMGRAPH_URI: bolt://127.0.0.1:7688
          MEMGRAPH_USERNAME: ""
          MEMGRAPH_PASSWORD: ""
        run: |
          node --input-type=module <<'JS'
          import neo4j from 'neo4j-driver';
          for (const [url,auth] of [[process.env.NEO4J_URI,neo4j.auth.basic('neo4j',process.env.NEO4J_PASSWORD)],[process.env.MEMGRAPH_URI,undefined]]) {
            const driver = neo4j.driver(url,auth);
            try {
              let ready = false;
              for (let attempt=0;attempt<30;attempt++) {
                try { await driver.verifyConnectivity(); ready=true; break; }
                catch { await new Promise(resolve=>setTimeout(resolve,2000)); }
              }
              if (!ready) throw Error(`Graph service unavailable: ${url}`);
            } finally { await driver.close(); }
          }
          JS
          timeout --kill-after=5s 240s node --experimental-vm-modules node_modules/jest/bin/jest.js --runTestsByPath tests/graph/graphAdapter.test.ts tests/graph/managed-runtime-safety.test.ts --runInBand --forceExit=false
          npx tsx scripts/cleanup-test-data.ts native
          cd packages/vercel-ai-provider
          timeout --kill-after=5s 240s node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --selectProjects graph --runInBand --forceExit=false

  public-contracts:
    name: Packed package and browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - run: |
          npm install --global npm@12.2.0
          npm ci
      - run: npm run build
      - run: npm run test:contracts
      - run: npm run build --workspace=@cortexmemory/cli
      - name: Exercise CI target, JWT, lifecycle and explicit-environment guards offline
        run: node --test scripts/ci/*.test.mjs
      - run: npm run test:release
      - name: Verify candidate-install refusals and transitive closure
        run: |
          npm install --global pnpm@10.33.0
          node --test scripts/install-ci-demo.test.mjs

  native-proof-contracts:
    name: Serialized native export, erasure and scope proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
        env:
          CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3210
          CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
          DISABLE_BEACON: "true"
        ports: [3210:3210, 3211:3211]
        options: --health-cmd "curl -f http://localhost:3210/version" --health-interval 5s --health-start-period 10s --health-retries 30
    env:
      CONVEX_TEST_MODE: local
      CONVEX_URL: http://127.0.0.1:3210
      LOCAL_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_TEST_EXPECTED_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_CI_EXPECTED_CONVEX_URL: http://127.0.0.1:3210
      CORTEX_CI_PREPARE_NATIVE_FIXTURES: "true"
      CORTEX_CI_ALLOW_DESTRUCTIVE_RESET: "true"
      CORTEX_CI_TARGET_CLASS: isolated-native
      CORTEX_CI_NATIVE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-native-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Authenticate the disposable native backend
        run: |
          CI_ADMIN_KEY=$(docker exec "${{ job.services.convex.id }}" ./generate_admin_key.sh)
          echo "::add-mask::$CI_ADMIN_KEY"
          echo "CONVEX_DEPLOY_KEY=$CI_ADMIN_KEY" >> "$GITHUB_ENV"
          echo "CORTEX_CI_NATIVE_CONTAINER_ID=${{ job.services.convex.id }}" >> "$GITHUB_ENV"
      - name: Prepare genuine canonical backend with private test fixtures
        run: node scripts/prepare-ci-backend.mjs
      - name: Run native proofs without unrelated concurrent seeds
        run: |
          for file in tests/user-export.test.ts tests/fact-history-provenance.test.ts \
            tests/facts-revision-scope.test.ts tests/domain-scope.test.ts tests/domain-operations.test.ts tests/memorySpaces.test.ts tests/operation-sequences.test.ts tests/gdprCascade.test.ts; do
            npx tsx scripts/cleanup-test-data.ts native
            node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --runTestsByPath "$file" --forceExit=false
          done

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 1: Detect which files changed (fast, runs first)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    # Fork changes cannot use deployment credentials.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      vercel-ai-provider: ${{ steps.filter.outputs.vercel-ai-provider }}
      cli: ${{ steps.filter.outputs.cli }}
      convex: ${{ steps.filter.outputs.convex }}
      sdk-release: ${{ steps.filter.outputs.sdk-release }}
      provider-release: ${{ steps.filter.outputs.provider-release }}
      cli-release: ${{ steps.filter.outputs.cli-release }}
      templates-release: ${{ steps.filter.outputs.templates-release }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          filters: |
            typescript:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'jest.config.mjs'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/**'
              - 'scripts/**'
            vercel-ai-provider:
              - 'packages/vercel-ai-provider/**'
            cli:
              - 'packages/cortex-cli/**'
            convex:
              - 'convex-dev/**'
            sdk-release:
              - 'src/**'
              - 'convex-dev/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
            provider-release:
              - 'packages/vercel-ai-provider/src/**'
              - 'packages/vercel-ai-provider/react/**'
              - 'packages/vercel-ai-provider/package.json'
              - 'packages/vercel-ai-provider/tsconfig*.json'
            templates-release:
              - 'packages/cortex-templates/**'
              - 'packages/cortex-cli/templates/**'
              - 'packages/vercel-ai-provider/quickstart/**'
            cli-release:
              - 'packages/cortex-cli/src/**'
              - 'packages/cortex-cli/package.json'
              - 'packages/cortex-cli/scripts/**'


      - name: Save release paths for this exact main commit
        if: github.event_name == 'push'
        env:
          SDK_CHANGED: ${{ steps.filter.outputs.sdk-release }}
          PROVIDER_CHANGED: ${{ steps.filter.outputs.provider-release }}
          CLI_CHANGED: ${{ steps.filter.outputs.cli-release }}
          TEMPLATES_CHANGED: ${{ steps.filter.outputs.templates-release }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("delivery-paths.json", JSON.stringify({sha:process.env.SOURCE_SHA,sdk:process.env.SDK_CHANGED === "true",provider:process.env.PROVIDER_CHANGED === "true",cli:process.env.CLI_CHANGED === "true",templates:process.env.TEMPLATES_CHANGED === "true"}));'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: delivery-paths
          path: delivery-paths.json
          retention-days: 30

      - name: Show detected changes
        run: |
          echo "📊 Detected Changes:"
          echo "  TypeScript SDK:      ${{ steps.filter.outputs.typescript }}"
          echo "  Vercel AI Provider:  ${{ steps.filter.outputs.vercel-ai-provider }}"
          echo "  CLI:                 ${{ steps.filter.outputs.cli }}"
          echo "  Convex Backend:      ${{ steps.filter.outputs.convex }}"
          echo ""
          if [[ "${{ steps.filter.outputs.typescript }}" == "true" || \
                "${{ steps.filter.outputs.vercel-ai-provider }}" == "true" || \
                "${{ steps.filter.outputs.cli }}" == "true" || \
                "${{ steps.filter.outputs.convex }}" == "true" ]]; then
            echo "✅ Tests will run for changed packages"
          else
            echo "⏭️  No testable changes detected - tests will be skipped"
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 2: Deploy Convex & Purge Database (runs once before all tests)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  setup-and-purge:
    timeout-minutes: 15
    env:
      CORTEX_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CORTEX_CI_AUTH_ISSUER: ${{ vars.CORTEX_CI_AUTH_ISSUER }}
      CORTEX_CI_AUTH_AUDIENCE: ${{ vars.CORTEX_CI_AUTH_AUDIENCE }}
      CORTEX_CI_AUTH_PRIVATE_KEY: ${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}
      CORTEX_CI_DISPOSABLE_DEPLOYMENTS: ${{ vars.CORTEX_CI_DISPOSABLE_DEPLOYMENTS }}
      CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL }}
      CONVEX_URL_CLI: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_CLI: ${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY_CLI }}
      CORTEX_CI_MODEL_MANIFEST_ID: ${{ vars.CORTEX_CI_MODEL_MANIFEST_ID }}
      CORTEX_CI_MODEL_MANIFEST_REVISION: ${{ vars.CORTEX_CI_MODEL_MANIFEST_REVISION }}
    name: Deploy & Provision Scoped Runtime Fixtures
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run if any tests need to run OR if targeting main branch
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.vercel-ai-provider == 'true' ||
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        needs.detect-changes.outputs.cli == 'true' ||
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Require explicitly approved disposable development targets
        run: node scripts/ci/verify-disposable-targets.mjs

      - name: Write public CI JWT verification config (preserve existing host auth)
        run: node scripts/ci/runtime-fixtures.mjs auth-config

      - name: Deploy SDK Convex backend to guarded dev target
        run: npx convex deploy --yes

      - name: Deploy CLI Convex backend to guarded distinct dev target
        run: npx convex deploy --yes
        env:
          CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY_CLI }}

      - name: Install the pinned compiled policy (unknown, synthetic or expired qualification fails closed)
        run: |
          node scripts/ci/runtime-fixtures.mjs install-policy sdk > ci-sdk-policy.json
          node scripts/ci/runtime-fixtures.mjs install-policy cli > ci-cli-policy.json

      - name: Provision exact scoped JWT fixture identities through the internal operator API
        run: |
          node scripts/ci/runtime-fixtures.mjs provision sdk > ci-sdk-fixtures.json
          node scripts/ci/runtime-fixtures.mjs provision cli > ci-cli-fixtures.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-runtime-fixture-receipts
          path: |
            ci-*-fixtures.json
            ci-*-policy.json
          retention-days: 14

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 3: Code Quality (runs in parallel with tests after purge)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  code-quality:
    name: Code Quality (Lint & Type Check)
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-and-purge]
    # Run if TypeScript files changed OR if PR is targeting main branch
    # IMPORTANT: Requires setup-and-purge to have SUCCEEDED (not just skipped) to ensure consistency with test jobs
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.setup-and-purge.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.typescript == 'true' ||
        (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - name: Install Node dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Run ESLint (TypeScript)
        if: needs.detect-changes.outputs.typescript == 'true' || (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run lint
        continue-on-error: false

      - name: Type check (TypeScript)
        if: needs.detect-changes.outputs.typescript == 'true' || (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx tsc --noEmit

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 3: TypeScript SDK Tests (five shards sharing one deployment)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test-typescript:
    timeout-minutes: 15
    env:
      CORTEX_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CORTEX_CI_AUTH_ISSUER: ${{ vars.CORTEX_CI_AUTH_ISSUER }}
      CORTEX_CI_AUTH_AUDIENCE: ${{ vars.CORTEX_CI_AUTH_AUDIENCE }}
      CORTEX_CI_AUTH_PRIVATE_KEY: ${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}
      CORTEX_CI_DISPOSABLE_DEPLOYMENTS: ${{ vars.CORTEX_CI_DISPOSABLE_DEPLOYMENTS }}
      CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL }}
      CONVEX_URL_CLI: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
    name: Test TypeScript SDK (Shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-and-purge]
    # Run if TypeScript SDK or Convex backend changed OR if PR is targeting main branch
    # IMPORTANT: Requires setup-and-purge to have SUCCEEDED (not just skipped) to ensure database isolation
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.setup-and-purge.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
      # Unique fixture IDs do not isolate deployment-wide lifecycle/range reads.
      # Concurrent writers caused native OCC disconnects and unknown erasure outcomes.
      max-parallel: 1
      fail-fast: false # Continue other shards even if one fails

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Preserve complete SDK test discovery (legacy live tests are not current runtime acceptance)
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --listTests --runInBand --json > ci-sdk-discovery.json
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid

      - name: Build current backend distribution for installed catalog contracts
        run: npm run build:backend

      - name: Run every current SDK unit suite (shard ${{ matrix.shard }}/5)
        run: |
          node --experimental-vm-modules node_modules/jest/bin/jest.js \
            --testPathPatterns=tests/unit/ \
            --shard=${{ matrix.shard }}/5 \
            --maxWorkers=75% --forceExit=false
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid
          CORTEX_CI_AUTH_PRIVATE_KEY: ""

      - name: Issue scoped verified-host JWTs for the single SDK actual suite
        if: matrix.shard == 1
        run: node scripts/ci/runtime-fixtures.mjs tokens sdk

      - name: Run authenticated registered SDK runtime integration (no legacy app-side model loop)
        if: matrix.shard == 1
        run: timeout --signal=TERM --kill-after=5s 240s node --experimental-vm-modules node_modules/jest/bin/jest.js --runTestsByPath tests/integration/runtime-ci.test.ts --runInBand --forceExit=false --json --outputFile=ci-sdk-runtime-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-sdk-discovery-and-runtime-${{ matrix.shard }}
          path: |
            ci-sdk-discovery.json
            ci-sdk-runtime-results.json
          retention-days: 14

      # Only build package once (on shard 1 to avoid redundant builds)
      - name: Build package
        if: matrix.shard == 1
        run: npm run build

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test-vercel-ai-provider:
    timeout-minutes: 15
    env:
      CORTEX_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CORTEX_CI_AUTH_ISSUER: ${{ vars.CORTEX_CI_AUTH_ISSUER }}
      CORTEX_CI_AUTH_AUDIENCE: ${{ vars.CORTEX_CI_AUTH_AUDIENCE }}
      CORTEX_CI_AUTH_PRIVATE_KEY: ${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}
      CORTEX_CI_DISPOSABLE_DEPLOYMENTS: ${{ vars.CORTEX_CI_DISPOSABLE_DEPLOYMENTS }}
      CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL }}
      CONVEX_URL_CLI: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
    name: Test Vercel AI Provider
    runs-on: ubuntu-latest
    # Provider integrations also write to the SDK's shared deployment.
    needs: [detect-changes, setup-and-purge, test-typescript]
    # Run if Vercel AI Provider changed OR if PR is targeting main branch
    # IMPORTANT: Requires setup-and-purge to have SUCCEEDED (not just skipped) to ensure database isolation
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.setup-and-purge.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (needs.test-typescript.result == 'success' || needs.test-typescript.result == 'skipped') &&
      (
        needs.detect-changes.outputs.vercel-ai-provider == 'true' ||
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - name: Install all workspace dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Issue scoped verified-host JWTs into private runner environment
        run: node scripts/ci/runtime-fixtures.mjs tokens sdk

      - name: Build main SDK first
        run: npm run build

      - name: Preserve complete provider discovery (legacy direct-provider E2E is not selected)
        working-directory: packages/vercel-ai-provider
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --listTests --runInBand --json > ci-provider-discovery.json
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid

      - name: Run provider unit, React, remote and mocked integration contracts
        run: |
          npm run test:unit --workspace=@cortexmemory/vercel-ai-provider -- --runInBand --forceExit=false
          npm run test:integration --workspace=@cortexmemory/vercel-ai-provider -- --runInBand --forceExit=false
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid
          CORTEX_CI_AUTH_PRIVATE_KEY: ""
          CORTEX_TEST_FIXTURE: ""
          CORTEX_TEST_AUTH_TOKEN: ""
          CORTEX_TEST_READER_TOKEN: ""
          CORTEX_TEST_OUTSIDER_TOKEN: ""

      - name: Build Vercel AI Provider declared package exports
        run: npm run build --workspace=@cortexmemory/vercel-ai-provider

      - name: Publish and verify the observed qualified V2 remote Agent with scoped owner authority
        run: timeout --signal=TERM --kill-after=5s 30s node scripts/ci/remote-agent.mjs > ci-provider-agent.json
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ""

      - name: Exercise one actual backend remote request through the official AI SDK7 parser
        working-directory: packages/vercel-ai-provider
        run: timeout --signal=TERM --kill-after=5s 210s node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --selectProjects e2e-remote --runTestsByPath tests/e2e/remote-runtime.test.ts --runInBand --forceExit=false --watchman=false --json --outputFile=ci-provider-remote-results.json
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ""
          DEBUG: "true"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-provider-discovery-and-runtime
          path: |
            ci-provider-agent.json
            packages/vercel-ai-provider/ci-provider-discovery.json
            packages/vercel-ai-provider/ci-provider-remote-results.json
          retention-days: 14

      - name: Lint Vercel AI Provider
        run: npm run lint --workspace=@cortexmemory/vercel-ai-provider

      - name: Verify package contents
        run: npm pack --dry-run --workspace=@cortexmemory/vercel-ai-provider

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 3: CLI Tests (parallel with other test jobs)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test-cli:
    timeout-minutes: 15
    env:
      CORTEX_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CORTEX_CI_AUTH_ISSUER: ${{ vars.CORTEX_CI_AUTH_ISSUER }}
      CORTEX_CI_AUTH_AUDIENCE: ${{ vars.CORTEX_CI_AUTH_AUDIENCE }}
      CORTEX_CI_AUTH_PRIVATE_KEY: ${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}
      CORTEX_CI_DISPOSABLE_DEPLOYMENTS: ${{ vars.CORTEX_CI_DISPOSABLE_DEPLOYMENTS }}
      CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL }}
      CONVEX_URL_CLI: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
    name: Test Cortex CLI
    runs-on: ubuntu-latest
    needs: [detect-changes, setup-and-purge]
    # Run if CLI changed OR if PR is targeting main branch
    # IMPORTANT: Requires setup-and-purge to have SUCCEEDED (not just skipped) to ensure database isolation
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.setup-and-purge.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.cli == 'true' ||
        needs.detect-changes.outputs.typescript == 'true' ||
        needs.detect-changes.outputs.convex == 'true' ||
        (github.event.pull_request.base.ref == 'main' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Use declared npm version
        run: npm install --global npm@12.2.0

      - name: Install all workspace dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Build main SDK first
        run: npm run build

      - name: Preserve complete CLI test discovery (legacy unauthenticated workflows are not selected)
        working-directory: packages/cortex-cli
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --listTests --runInBand --json > ci-cli-discovery.json
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid

      - name: Build the CLI executable before command contracts
        run: npm run build --workspace=@cortexmemory/cli

      - name: Install supported completion shells for command contracts
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh fish

      - name: Prepare isolated command fixtures from current built dependencies
        run: node scripts/ci/command-fixtures.mjs prepare --directory "$RUNNER_TEMP/cortex-cli-command-fixtures" --env-file "$GITHUB_ENV"
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ""

      - name: Run CLI unit and command contracts without live credentials
        run: npm run test:fast --workspace=@cortexmemory/cli -- --runInBand
        env:
          CONVEX_URL: https://unit.invalid
          CONVEX_URL_CLI: https://unit.invalid
          CORTEX_CI_AUTH_PRIVATE_KEY: ""

      - name: Remove owned offline command fixtures after success or failure
        if: always()
        run: node scripts/ci/command-fixtures.mjs cleanup --directory "$RUNNER_TEMP/cortex-cli-command-fixtures"
        env:
          CORTEX_CI_AUTH_PRIVATE_KEY: ""

      - name: Issue scoped verified-host JWTs into private runner environment
        run: node scripts/ci/runtime-fixtures.mjs tokens cli

      - name: Run authenticated registered runtime integration on the distinct CLI target
        run: timeout --signal=TERM --kill-after=5s 240s node --experimental-vm-modules node_modules/jest/bin/jest.js --runTestsByPath tests/integration/runtime-ci.test.ts --runInBand --forceExit=false --json --outputFile=ci-cli-runtime-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-cli-discovery-and-runtime
          path: |
            packages/cortex-cli/ci-cli-discovery.json
            ci-cli-runtime-results.json
          retention-days: 14

      - name: Lint CLI
        run: npm run lint --workspace=@cortexmemory/cli

      - name: Verify CLI version matches package.json
        run: |
          echo "🔍 Verifying CLI version synchronization..."
          PACKAGE_VERSION=$(node -p "require('./packages/cortex-cli/package.json').version")
          CLI_VERSION=$(node packages/cortex-cli/dist/index.js --version)
          echo "  package.json version: $PACKAGE_VERSION"
          echo "  CLI --version output:  $CLI_VERSION"
          if [[ "$PACKAGE_VERSION" != "$CLI_VERSION" ]]; then
            echo ""
            echo "❌ Version mismatch detected!"
            echo "   The CLI is reporting a different version than package.json."
            echo "   This can happen if VERSION was hardcoded instead of read from package.json."
            exit 1
          fi
          echo "✅ CLI version matches package.json"

      - name: Verify package contents
        run: npm pack --dry-run --workspace=@cortexmemory/cli

  cleanup-runtime-fixtures:
    timeout-minutes: 10
    name: Retire exact CI fixture authority
    runs-on: ubuntu-latest
    needs: [setup-and-purge, code-quality, test-typescript, test-vercel-ai-provider, test-cli]
    if: always() && (needs.setup-and-purge.result == 'success' || needs.setup-and-purge.result == 'failure' || needs.setup-and-purge.result == 'cancelled')
    env:
      CORTEX_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CORTEX_CI_AUTH_ISSUER: ${{ vars.CORTEX_CI_AUTH_ISSUER }}
      CORTEX_CI_AUTH_AUDIENCE: ${{ vars.CORTEX_CI_AUTH_AUDIENCE }}
      CORTEX_CI_AUTH_PRIVATE_KEY: ${{ secrets.CORTEX_CI_AUTH_PRIVATE_KEY }}
      CORTEX_CI_DISPOSABLE_DEPLOYMENTS: ${{ vars.CORTEX_CI_DISPOSABLE_DEPLOYMENTS }}
      CONVEX_URL: ${{ secrets.CORTEX_CI_CONVEX_URL }}
      CONVEX_URL_CLI: ${{ secrets.CORTEX_CI_CONVEX_URL_CLI }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOY_KEY_CLI: ${{ secrets.CORTEX_CI_CONVEX_DEPLOY_KEY_CLI }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - run: |
          npm install --global npm@12.2.0
          npm ci
      - name: Retire owned SDK test tenant; preserve failure and tombstone history
        if: always()
        run: npx tsx scripts/cleanup-test-data.ts sdk > ci-sdk-cleanup.json
      - name: Retire owned CLI test tenant; preserve failure and tombstone history
        if: always()
        run: npx tsx scripts/cleanup-test-data.ts cli > ci-cli-cleanup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runtime-cleanup-receipts
          path: ci-*-cleanup.json
          retention-days: 14

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 4: All Checks Passed (final gate)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  all-checks-passed:
    name: All Checks Passed
    needs:
      [
        public-contracts,
        template-catalog,
        demo-contracts,
        graph-contracts,
        native-proof-contracts,
        detect-changes,
        setup-and-purge,
        cleanup-runtime-fixtures,
        test-typescript,
        test-vercel-ai-provider,
        test-cli,
        code-quality,
      ]
    # Backend integration gate applies to trusted same-repository changes.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check if all jobs passed
        run: |
          test "${{ needs.public-contracts.result }}" = "success"
          test "${{ needs.template-catalog.result }}" = "success"
          test "${{ needs.demo-contracts.result }}" = "success"
          test "${{ needs.graph-contracts.result }}" = "success"
          if [[ "${{ needs.setup-and-purge.result }}" == "success" ]]; then
            test "${{ needs.cleanup-runtime-fixtures.result }}" = "success"
          fi
          test "${{ needs.native-proof-contracts.result }}" = "success"
          echo "📊 Check Results:"
          echo "  Detect Changes:           ${{ needs.detect-changes.result }}"
          echo "  Setup & Purge:            ${{ needs.setup-and-purge.result }}"
          echo "  Code Quality:             ${{ needs.code-quality.result }}"
          echo "  TypeScript Tests:         ${{ needs.test-typescript.result }}"
          echo "  Vercel AI Provider Tests: ${{ needs.test-vercel-ai-provider.result }}"
          echo "  CLI Tests:                ${{ needs.test-cli.result }}"
          echo ""
          echo "ℹ️  Security scans run in separate workflow (see Security tab)"
          echo ""

          for result in "${{ needs.detect-changes.result }}" "${{ needs.setup-and-purge.result }}" "${{ needs.code-quality.result }}" "${{ needs.test-typescript.result }}" "${{ needs.test-vercel-ai-provider.result }}" "${{ needs.test-cli.result }}"; do
            case "$result" in failure|cancelled) exit 1 ;; esac
          done
          # Detect changes must pass (it's the root job)
          if [[ "${{ needs.detect-changes.result }}" == "failure" ]]; then
            echo "❌ Detect changes failed"
            exit 1
          fi

          # Setup & purge must pass if it ran
          if [[ "${{ needs.setup-and-purge.result }}" == "failure" ]]; then
            echo "❌ Setup & purge failed"
            exit 1
          fi

          # Validate that tests ran when they should have
          # If setup-and-purge succeeded, tests should not be skipped (they should pass or fail)
          if [[ "${{ needs.setup-and-purge.result }}" == "success" ]]; then
            # Check TypeScript tests
            if [[ ("${{ needs.detect-changes.outputs.typescript }}" == "true" || \
                   "${{ needs.detect-changes.outputs.convex }}" == "true" || \
                   "${{ github.event.pull_request.base.ref }}" == "main") && \
                  "${{ needs.test-typescript.result }}" == "skipped" ]]; then
              echo "❌ TypeScript tests should have run but were skipped"
              exit 1
            fi


            # Check Vercel AI Provider tests
            if [[ ("${{ needs.detect-changes.outputs.vercel-ai-provider }}" == "true" || \
                   "${{ github.event.pull_request.base.ref }}" == "main") && \
                  "${{ needs.test-vercel-ai-provider.result }}" == "skipped" ]]; then
              echo "❌ Vercel AI Provider tests should have run but were skipped"
              exit 1
            fi

            # Check CLI tests
            if [[ ("${{ needs.detect-changes.outputs.cli }}" == "true" || \
                   "${{ github.event.pull_request.base.ref }}" == "main") && \
                  "${{ needs.test-cli.result }}" == "skipped" ]]; then
              echo "❌ CLI tests should have run but were skipped"
              exit 1
            fi

            # Check code quality
            if [[ ("${{ needs.detect-changes.outputs.typescript }}" == "true" || \
                   "${{ github.event.pull_request.base.ref }}" == "main") && \
                  "${{ needs.code-quality.result }}" == "skipped" ]]; then
              echo "❌ Code quality checks should have run but were skipped"
              exit 1
            fi
          fi

          # Code quality must pass OR be skipped (when no changes)
          if [[ "${{ needs.code-quality.result }}" == "failure" ]]; then
            echo "❌ Code quality check failed"
            exit 1
          fi

          # TypeScript tests must pass OR be skipped (when no changes)
          if [[ "${{ needs.test-typescript.result }}" == "failure" ]]; then
            echo "❌ TypeScript tests failed"
            exit 1
          fi


          # Vercel AI Provider tests must pass OR be skipped (when no changes)
          if [[ "${{ needs.test-vercel-ai-provider.result }}" == "failure" ]]; then
            echo "❌ Vercel AI Provider tests failed"
            exit 1
          fi

          # CLI tests must pass OR be skipped (when no changes)
          if [[ "${{ needs.test-cli.result }}" == "failure" ]]; then
            echo "❌ CLI tests failed"
            exit 1
          fi

          echo ""
          echo "✅ All PR checks passed!"
