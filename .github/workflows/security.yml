name: Security Scans

# Diagnostic branch only. Exactly one manually dispatched observational baseline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Remote-main Scorecard baseline (two separate scans; observational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Assert refusal contracts before native scans or upload
        timeout-minutes: 2
        run: node --test tests/scorecard-main-baseline.test.mjs
      - name: Run two independent pinned remote-main analyses with source fences
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scorecard-main-baseline.mjs run "$RUNNER_TEMP/scorecard-main-baseline"
      - name: Validate untouched outputs and final live-main source fence
        id: preupload
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scorecard-main-baseline.mjs preupload "$RUNNER_TEMP/scorecard-main-baseline"
      - name: Upload unchanged native SARIF to its observational main destination
        if: success() && steps.preupload.outputs.upload_ready == 'true'
        timeout-minutes: 4
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: ${{ runner.temp }}/scorecard-main-baseline/native-sarif.stdout
          ref: refs/heads/main
          sha: 924b2e9ff6b615dcf0f26377de57aac9bf4607cb
          wait-for-processing: true
      - name: Preserve raw outputs, process receipts, official pin and source observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-main-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scorecard-main-baseline/
          if-no-files-found: warn
          retention-days: 14
