name: "Security Scans"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, chore/cortex-0.37-modernization]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Scanners do not mutate Convex. Superseded scans may be cancelled; a cancelled
# mandatory job cannot pass the current run's summary.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

# Required on every event, including draft/fork/Dependabot PRs: CodeQL, Trivy,
# Gitleaks and Semgrep execution + valid results. Dependency Review is PR-only.
# GitHub permits code-scanning PR uploads with read-only fork/Dependabot tokens:
# https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible
# Only non-PR Dependabot uploads are unavailable; local coverage still runs and
# the summary reports the missing uploaded alert coverage. No vendor secrets.
# Findings: Gitleaks blocks leaks; Dependency Review retains the reviewed high
# severity + license policy. CodeQL/Trivy/Semgrep preserve existing GitHub alert
# enforcement. Trivy/Semgrep CLI completion is not a zero-vulnerability claim.

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: +security-extended
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Use declared npm version
        run: npm install --global npm@12.2.0
      - name: Install dependencies
        run: npm ci
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: ${{ github.event_name == 'pull_request' || github.actor != 'dependabot[bot]' }}
      - name: Validate CodeQL results
        run: |
          for file in codeql-results/*.sarif; do
            node scripts/security-contract.mjs sarif "$file" CodeQL
          done
      - name: Preserve CodeQL results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: error

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; retain dev SHA-pinning policy
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          # Existing GitHub alert policy is the finding gate; this is execution.
          exit-code: "0"
      - name: Validate Trivy results
        run: node scripts/security-contract.mjs sarif trivy-results.sarif Trivy
      - name: Upload Trivy results to GitHub Security tab
        if: github.event_name == 'pull_request' || github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-dependencies"
      - name: Preserve Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
      - name: Validate Gitleaks results
        if: always()
        run: node scripts/security-contract.mjs sarif results.sarif Gitleaks
      - name: Preserve Gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          # Job summary works on forks/bots without PR write permission.
          comment-summary-in-pr: never

  # Advisory scores: failed analysis/upload is reported, not a mandatory gate.
  scorecard:
    name: Supply Chain Security (Scorecard)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: true
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: "scorecard"
      - name: Report advisory outcome
        if: always()
        env:
          SCORECARD_STEPS: ${{ toJSON(steps) }}
        run: |
          echo '### Scorecard (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo "$SCORECARD_STEPS" >> "$GITHUB_STEP_SUMMARY"

  api-security:
    name: API Security Scan (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      scanned: ${{ steps.scan.outputs.scanned }}
      findings: ${{ steps.scan.outputs.findings }}
      partial_parsing: ${{ steps.scan.outputs.partial_parsing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup Python for Semgrep CE
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install supported Semgrep CLI
        run: python -m pip install semgrep==1.179.0
      - name: Run Semgrep and enforce execution/result contract
        id: scan
        run: node scripts/security-contract.mjs semgrep
      - name: Upload Semgrep SARIF
        if: github.event_name == 'pull_request' || github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: "semgrep-api-security"
      - name: Preserve Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: error

  security-summary:
    name: Security Checks Summary
    needs: [codeql-analysis, dependency-scan, secret-scan, api-security, dependency-review, scorecard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout security contract
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enforce required security coverage
        env:
          SECURITY_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/security-contract.mjs summary
